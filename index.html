<title>NewsFz · Tu estilo, tu esencia, tu bolso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Jost:wght@400;500&amp;display=swap">
<style>
:root{--bg:#fbf6f3;--card:#fff;--ink:#3a2a2e;--mute:#8a7479;--rose:#c98b9a;--rose2:#a9677a;--gold:#b8955a;--line:#eadcd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f171a;--card:#2a2024;--ink:#f3e8ea;--mute:#b9a3a8;--rose:#d6a0ae;--rose2:#e0b0bd;--gold:#d3b27a;--line:#3b2d32}}
:root[data-theme="dark"]{--bg:#1f171a;--card:#2a2024;--ink:#f3e8ea;--mute:#b9a3a8;--rose:#d6a0ae;--rose2:#e0b0bd;--gold:#d3b27a;--line:#3b2d32}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Jost,system-ui,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:0 16px 90px}
header{text-align:center;padding:28px 0 8px}
.logo{font:600 44px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.04em;color:var(--rose2)}
.slo{margin:6px 0 0;color:var(--gold);font:italic 500 18px "Cormorant Garamond",Georgia,serif}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
button,.btn,input,select,textarea{font:inherit}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 16px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--rose2);border-color:var(--rose2);color:#fff}
.promo{background:linear-gradient(90deg,var(--rose),var(--gold));color:#fff;padding:10px 14px;border-radius:12px;margin:8px 0;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1;background:linear-gradient(135deg,#f3dfe2,#efe3d0);display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover}
.ph span{font:600 64px "Cormorant Garamond",Georgia,serif;color:#fff}
.fav{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:#ffffffd9;color:#a9677a;font-size:20px;cursor:pointer}
.bd{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.bd small{color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.bd h3{margin:0;font:600 21px "Cormorant Garamond",Georgia,serif}
.bd p{margin:0;color:var(--mute);font-size:14px;flex:1}
.pr{color:var(--gold);font-weight:500}
.bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--rose2);color:#fff;border:0;border-radius:99px;padding:8px 14px;text-decoration:none;cursor:pointer;font-size:14px}
.btn.o{background:transparent;color:var(--rose2);border:1px solid var(--rose2)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.box h2{margin:0 0 8px;font:600 24px "Cormorant Garamond",Georgia,serif;color:var(--rose2)}
.f{display:grid;gap:8px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-top:1px solid var(--line);text-align:left}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;border-radius:99px;padding:12px 18px;text-decoration:none;box-shadow:0 4px 14px #0003}
.pub{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.note{color:var(--mute);font-size:13px;text-align:center;margin-top:28px}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
let D=JSON.parse($('#data').textContent),U=null,owner=false,edit=false,db=null,uid=null,tab='cat',cat='all',dirty=false,ed=null,clients=undefined;
let me={name:'',wa:'',favs:[],clicks:{}};
try{me={...me,...JSON.parse(localStorage.nfz||'{}')}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wa=n=>'https://wa.me/'+D.wa+'?text='+encodeURIComponent('Hola NewsFz, me interesa: '+n);
const v=id=>($('#'+id)||{}).value||'';
async function saveMe(){
  try{localStorage.nfz=JSON.stringify(me)}catch(e){}
  if(db&&uid){try{await db.doc('data/users/'+uid+'/me').set(me);if(me.name)await db.doc('clients/'+uid).set({...me,ts:Date.now()})}catch(e){}}
}
function card(p){
  const f=(me.favs||[]).includes(p.id);
  return `<article class="card"><div class="ph">${p.i?`<img src="${p.i}" alt="${esc(p.n)}">`:`<span>${esc((p.n||'N')[0])}</span>`}<button class="fav" data-a="fav" data-id="${p.id}" aria-label="Favorito">${f?'♥':'♡'}</button></div><div class="bd"><small>${esc(p.c)}</small><h3>${esc(p.n)}</h3>${p.p?`<div class="pr">${esc(p.p)}</div>`:''}<p>${esc(p.d)}</p><div class="bt">${p.t?`<a class="btn" data-a="trk" data-id="${p.id}" href="${esc(p.t)}" target="_blank" rel="noopener sponsored">Comprar en Temu</a>`:''}<a class="btn o" data-a="trk" data-id="${p.id}" href="${wa(p.n)}" target="_blank" rel="noopener">WhatsApp</a></div></div></article>`;
}
function adminView(){
  const e=ed||{};
  let h=`<div class="box"><h2>${ed?'Editar producto':'Nuevo producto'}</h2><div class="f"><input id="pn" placeholder="Nombre" value="${esc(e.n)}"><select id="pc"><option ${e.c==='Bolso de tela'?'selected':''}>Bolso de tela</option><option ${e.c==='Tote bag'?'selected':''}>Tote bag</option></select><input id="pp" placeholder="Precio (opcional, ej. $12)" value="${esc(e.p)}"><textarea id="pd" rows="2" placeholder="Descripción corta">${esc(e.d)}</textarea><input id="pt" placeholder="Enlace de afiliada de Temu (https://…)" value="${esc(e.t)}"><input id="pi" type="file" accept="image/*"><div class="bt"><button class="btn" data-a="saveP">Guardar producto</button>${ed?'<button class="btn o" data-a="cancel">Cancelar</button>':''}</div></div></div>`;
  h+=`<div class="box"><h2>Productos</h2>${D.products.map(p=>`<div class="row"><span>${esc(p.n)}</span><span class="bt"><button class="btn o" data-a="edit" data-id="${p.id}">Editar</button><button class="btn o" data-a="del" data-id="${p.id}">Borrar</button></span></div>`).join('')||'Sin productos.'}</div>`;
  h+=`<div class="box"><h2>Promociones</h2><div class="f"><input id="rt" placeholder="Título (ej. 2×1 en totes)"><input id="rx" placeholder="Detalle"><button class="btn" data-a="savePr">Proponer promoción</button></div>${D.promos.map(x=>`<div class="row"><span>${esc(x.t)} · ${x.s==='ok'?'✅ autorizada':'⏳ pendiente'}</span><span class="bt">${owner&&x.s!=='ok'?`<button class="btn" data-a="ok" data-id="${x.id}">Autorizar</button>`:''}<button class="btn o" data-a="delPr" data-id="${x.id}">Borrar</button></span></div>`).join('')}<p class="note" style="text-align:left">Solo las promociones autorizadas por la dueña se muestran en el catálogo.</p></div>`;
  h+=`<div class="box"><h2>Clientes y clics</h2>${!db?'<p>La base de datos no está disponible en esta sesión.</p>':clients===undefined?'Cargando…':clients===null?'<p>No se pudieron leer los datos.</p>':`<p>Clientes registradas: <b>${clients.filter(c=>c.name).length}</b></p><div class="sc"><table><tr><th>Producto</th><th>Clics</th><th>Favoritos</th></tr>${D.products.map(p=>`<tr><td>${esc(p.n)}</td><td>${clients.reduce((a,c)=>a+((c.clicks||{})[p.id]||0),0)}</td><td>${clients.filter(c=>(c.favs||[]).includes(p.id)).length}</td></tr>`).join('')}</table></div><div class="sc"><table><tr><th>Cliente</th><th>WhatsApp</th></tr>${clients.filter(c=>c.name).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.wa)}</td></tr>`).join('')}</table></div>`}</div>`;
  h+=`<div class="box"><h2>Ajustes</h2><div class="f"><label>Tu WhatsApp (593 + número sin el 0 inicial)</label><input id="wn" placeholder="593987654321" value="${esc(D.wa)}"><label>Tu enlace para invitar a otras personas a afiliarse a Temu (opcional)</label><input id="rf" placeholder="https://…" value="${esc(D.ref)}"><button class="btn" data-a="saveWa">Guardar ajustes</button></div></div>`;
  return h;
}
function render(){
  const fv=me.favs||[],reg=!!me.name;
  const ps=D.products.filter(p=>cat==='all'||p.c===cat);
  let h=`<div class="w"><header><div class="logo">NewsFz</div><p class="slo">Tu estilo, tu esencia, tu bolso</p></header><nav>`;
  h+=[['cat','Catálogo'],['fav','Favoritos ('+fv.length+')']].concat(edit?[['adm','Panel']]:[]).map(([k,l])=>`<button class="chip ${tab===k?'on':''}" data-a="tab" data-id="${k}">${l}</button>`).join('')+'</nav>';
  if(tab==='adm'&&edit)h+=adminView();
  else{
    h+=D.promos.filter(x=>x.s==='ok').map(x=>`<div class="promo">✨ <b>${esc(x.t)}</b> ${esc(x.x)}</div>`).join('');
    if(tab==='cat')h+=`<nav>${[['all','Todos'],['Tote bag','Tote bags'],['Bolso de tela','Bolsos de tela']].map(([k,l])=>`<button class="chip ${cat===k?'on':''}" data-a="cat" data-id="${k}">${l}</button>`).join('')}</nav>`;
    const list=tab==='fav'?D.products.filter(p=>fv.includes(p.id)):ps;
    h+=list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<p style="text-align:center;color:var(--mute)">Aún no hay productos aquí.</p>';
    if(db&&uid)h+=reg?`<div class="box">Hola, <b>${esc(me.name)}</b> ♡ Tus favoritos y tus intereses quedan guardados.</div>`:`<div class="box"><h2>Crea tu perfil</h2><div class="f"><input id="rn" placeholder="Tu nombre"><input id="rw" placeholder="Tu WhatsApp"><button class="btn" data-a="reg">Registrarme</button></div></div>`;
    else h+=`<div class="box" style="text-align:center"><p>¿Quieres enterarte de novedades y promociones?</p><a class="btn" href="https://wa.me/${D.wa}?text=${encodeURIComponent('Hola NewsFz, quiero recibir novedades y promociones')}" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></div><p class="note">Tus favoritos se guardan en este dispositivo.</p>`;
  }
  if(D.ref)h+=`<div class="box" style="text-align:center"><h2>¿Quieres ganar con Temu?</h2><p>Únete como afiliada con mi enlace.</p><a class="btn" href="${esc(D.ref)}" target="_blank" rel="noopener sponsored">Quiero afiliarme</a></div>`;
  h+=`<p class="note">Como afiliada de Temu, NewsFz puede recibir una comisión por las compras hechas desde estos enlaces, sin costo extra para ti.</p></div><a class="wa" href="https://wa.me/${D.wa}?text=${encodeURIComponent('Hola NewsFz, quiero más información')}" target="_blank" rel="noopener">WhatsApp</a>${dirty?'<button class="btn pub" data-a="pub">Publicar cambios</button>':''}`;
  $('#app').innerHTML=h;
}
async function pub(){
  const a=await window.claude.use('artifact');
  if(!a){alert('No se puede publicar desde esta sesión.');return}
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';
  c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
  try{await a.publish('<!DOCTYPE html>\n'+c.outerHTML)}catch(e){alert('No se pudo publicar: '+(e.message||e.code))}
}
function shrink(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};im.src=fr.result};fr.readAsDataURL(f)})}
const act={
  tab:id=>{tab=id;if(id==='adm'&&clients===undefined)load();render()},
  cat:id=>{cat=id;render()},
  fav:id=>{const f=me.favs=me.favs||[],i=f.indexOf(id);i<0?f.push(id):f.splice(i,1);saveMe();render()},
  trk:id=>{me.clicks=me.clicks||{};me.clicks[id]=(me.clicks[id]||0)+1;saveMe()},
  reg:()=>{const n=v('rn').trim();if(!n)return;me.name=n;me.wa=v('rw').trim();saveMe();render()},
  edit:id=>{ed=D.products.find(p=>p.id===id);render()},
  cancel:()=>{ed=null;render()},
  del:id=>{if(confirm('¿Borrar este producto?')){D.products=D.products.filter(p=>p.id!==id);dirty=true;render()}},
  saveP:async()=>{
    const n=v('pn').trim(),t=v('pt').trim();
    if(!n)return alert('Escribe un nombre.');
    if(t&&!/^https?:\/\//i.test(t))return alert('El enlace debe empezar con https://');
    const f=($('#pi')||{}).files&&$('#pi').files[0];
    const p=ed||{id:'p'+Date.now(),i:''};
    Object.assign(p,{n,c:v('pc'),p:v('pp').trim(),d:v('pd').trim(),t});
    if(f)p.i=await shrink(f);
    if(!ed)D.products.push(p);
    ed=null;dirty=true;render();
  },
  savePr:()=>{const t=v('rt').trim();if(!t)return;D.promos.push({id:'r'+Date.now(),t,x:v('rx').trim(),s:'pend'});dirty=true;render()},
  ok:id=>{const x=D.promos.find(r=>r.id===id);if(x&&owner){x.s='ok';dirty=true;render()}},
  delPr:id=>{D.promos=D.promos.filter(r=>r.id!==id);dirty=true;render()},
  saveWa:()=>{const n=v('wn').replace(/\D/g,''),r=v('rf').trim();if(r&&!/^https?:\/\//i.test(r))return alert('El enlace debe empezar con https://');if(n)D.wa=n;D.ref=r;dirty=true;render()},
  pub
};
async function load(){
  if(!db){return}
  try{clients=(await db.collection('clients').get()).docs.map(d=>d.data())}catch(e){clients=null}
  render();
}
